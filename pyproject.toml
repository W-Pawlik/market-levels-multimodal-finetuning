[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "market-levels"
version = "0.1.0"
description = "Research pipeline for support and resistance levels on financial charts"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
charts = ["matplotlib>=3.9,<4"]

[project.urls]
Repository = "https://github.com/W-Pawlik/market-levels-multimodal-finetuning"

[project.scripts]
market-levels-download = "market_levels.cli.download:main"
market-levels-generate-synthetic = "market_levels.cli.generate_synthetic:main"
market-levels-calibrate = "market_levels.cli.calibrate_synthetic:main"
market-levels-refine-v2-volatility = "market_levels.cli.refine_v2_volatility:main"
market-levels-compare-synthetic = "market_levels.cli.compare_synthetic:main"
market-levels-audit-charts = "market_levels.cli.audit_charts:main"
market-levels-label-pilot = "market_levels.cli.label_pilot:main"
market-levels-build-dataset = "market_levels.cli.build_dataset:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["market_levels*"]
